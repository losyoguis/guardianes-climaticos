<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="refresh" content="1; url=./index.html#soluciones" />
<title>Redirección de Zona | Guardianes Climáticos</title>
<style>
  :root{--verde:#1a5e2a;--verde2:#4CAF50;--fondo:#f4fff5;--texto:#14361d;--card:#ffffff;--borde:#d4ead9}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#effff2,#e1f8e6);color:var(--texto);display:grid;min-height:100svh;place-items:center;padding:24px}
  .card{width:min(100%,620px);background:var(--card);border:1px solid var(--borde);border-radius:24px;padding:24px;box-shadow:0 20px 48px rgba(0,0,0,.08);text-align:center}
  h1{margin:0 0 10px;font-size:clamp(1.4rem,4vw,2rem)}
  p{margin:0 0 16px;line-height:1.6}
  a{display:inline-block;background:var(--verde);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <main class="card">
    <h1>Redirección de Zona</h1>
    <p id="legacy-note">Esta zona fue integrada dentro de las misiones principales.</p>
    <p>Serás redirigido automáticamente en un momento.</p>
    <a href="./index.html#soluciones">Abrir experiencia principal</a>
  </main>
  <script src="js/app.js"></script>
<script>
(function(){
  async function cleanupWebAppOnly(){
    try{
      if('serviceWorker' in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister().catch(() => false)));
      }
      if('caches' in window){
        const keys = await caches.keys();
        await Promise.all(keys.filter(k => /guardianes|gcmed|climatic|pwa/i.test(k)).map(k => caches.delete(k)));
      }
    }catch(err){
      console.warn('Limpieza web app only:', err);
    }
  }
  window.addEventListener('load', cleanupWebAppOnly, { once:true });
})();
</script>
</body>
</html>
