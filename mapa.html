<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Medellín 2035</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="futuro">
<div class="hud">
<h1>🌆 Medellín 2035</h1>
<p>La ciudad está viva</p>
</div>

<svg viewBox="0 0 900 600" class="mapa-svg">
<path d="M0,300 Q200,50 450,250 Q700,50 900,300 L900,0 L0,0 Z" class="montanas"/>
<path d="M450,0 C430,150 470,300 450,600" class="rio"/>

<circle cx="250" cy="350" r="55" class="zona naturaleza activa" data-zona="naturaleza"/>
<circle cx="450" cy="250" r="55" class="zona ciudad bloqueada" data-zona="ciudad"/>
<circle cx="350" cy="480" r="55" class="zona agua bloqueada" data-zona="agua"/>
<circle cx="650" cy="380" r="55" class="zona energia bloqueada" data-zona="energia"/>
</svg>

<div id="panelZona" class="panel oculto"></div>

<div id="npc" class="npc">
<div class="holo"></div>
<div class="npc-msg">👋 Hola Guardián. Protejamos la ciudad.</div>
</div>

<button class="btn-logros" onclick="mostrarLogros()">🏅</button>
<button class="btn-ranking" onclick="mostrarRanking()">📊</button>

<div id="panelLogros" class="panel oculto"></div>
<div id="panelRanking" class="panel oculto"></div>

<div class="radar"></div>

<script src="js/app.js"></script>
</body>
</html>
